<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kan2sci</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-name">kan2sci</span>
      <span class="brand-version">v3.0</span>
    </div>
    <div class="sync-indicator" id="syncIndicator" title="Sincroniza&ccedil;&atilde;o autom&aacute;tica em segundo plano">
      <span class="sync-dot" id="syncDot" aria-hidden="true"></span>
      <span class="sync-label" id="syncLabel" aria-live="polite">Verificando&hellip;</span>
    </div>
  </header>

  <main class="main">
    <!-- Perfil do Usuario -->
    <section class="section profile-section" id="profileSection">
      <div class="section-header">
        <h2 class="section-title">Perfil do Usu&aacute;rio</h2>
      </div>

      <div class="profile-body">
        <!-- Estado recolhido: perfil ja preenchido -->
        <div class="profile-summary" id="profileSummary" hidden>
          <div class="profile-summary-info">
            <span class="profile-avatar" aria-hidden="true">
              <img src="../icons/sci-logo.png" alt="" id="profileAvatarImg">
            </span>
            <div class="profile-summary-text">
              <span class="profile-summary-name" id="profileSummaryName"></span>
              <span class="profile-summary-role" id="profileSummaryRole"></span>
            </div>
          </div>
          <button type="button" class="profile-edit-btn" id="profileEditBtn">Editar</button>
        </div>

        <!-- Estado expandido: formulario, visivel quando o perfil ainda nao foi preenchido ou esta em edicao -->
        <div class="profile-form" id="profileForm">
          <div class="profile-form-fields">
            <div class="form-group form-group-name">
              <label for="userName">Nome</label>
              <input type="text" id="userName" class="form-input" placeholder="Ex: Jo&atilde;o Silva" autocomplete="off">
            </div>
            <div class="form-group form-group-sector">
              <label for="userSector">Setor</label>
              <select id="userSector" class="form-input">
                <option value="">Selecione...</option>
                <option value="RH Net Social">RH Net Social</option>
                <option value="SCI WEB">SCI WEB</option>
              </select>
            </div>
            <div class="form-group">
              <label for="userRole">Cargo</label>
              <input type="text" id="userRole" class="form-input" placeholder="Ex: Analista" autocomplete="off">
            </div>
          </div>
          <div class="profile-form-actions">
            <button id="saveProfileBtn" class="btn btn-primary">Salvar Perfil</button>
            <button type="button" id="cancelProfileBtn" class="btn btn-ghost" hidden>Cancelar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Lista de Snippets -->
    <section class="section snippets-section">
      <div class="section-header">
        <h2 class="section-title">Snippets Disponiveis</h2>
        <span class="count-badge" id="snippetCount">0</span>
      </div>
      <div class="top-used" id="topUsedSection" hidden>
        <span class="top-used-title">Mais usados</span>
        <div class="top-used-list" id="topUsedList"></div>
      </div>
      <div class="search-box">
        <input type="text" id="snippetSearch" class="form-input search-input" placeholder="Pesquisar por nome ou atalho..." autocomplete="off" aria-label="Pesquisar snippets">
        <button type="button" class="search-clear" id="searchClear" aria-label="Limpar pesquisa" hidden>&times;</button>
      </div>
      <div class="snippet-list" id="snippetContainer">
        <div class="empty-state" id="emptyState">
          <p class="empty-text">Nenhum snippet carregado.</p>
          <p class="empty-sub">A sincronizacao automatica atualiza a lista em segundo plano.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>kan2sci &middot; SCI Sistemas Contabeis</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
